name: Build Munaf Shop APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" || true
          sdkmanager "build-tools;36.0.0" || true
          sdkmanager "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or create debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Build Debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --console=plain > build_ci.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=== FAILURE SUMMARY (READ THIS) ==="
            grep -nE "(FAILURE:|What went wrong:|Execution failed|Caused by:|e: |error:|Exception)" build_ci.log | head -n 35
            echo "=== END SUMMARY ==="
            exit $STATUS
          fi
          tail -n 20 build_ci.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: munaf-shop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
